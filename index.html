name:g[0],platform:g[1],genre:g[2],emoji:g[3],developer:g[4],

const imageCache=new Map();

function getRating(name){
const ratings=JSON.parse(localStorage.getItem("oyunPuanlari")||"{}");
const list=ratings[name]||[];
if(!list.length)return {average:0,count:0};
return {
average:list.reduce((a,b)=>a+b,0)/list.length,
count:list.length
};
}

function imageUrl(g){
if(g.image)return g.image;
if(g.app)return "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/"+g.app+"/header.jpg";
return "";
}

async function findGameImage(g){
if(imageCache.has(g.name))return imageCache.get(g.name);
try{
const response=await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(g.name));
if(!response.ok)throw new Error();
const data=await response.json();
const image=data.thumbnail?.source||"";
imageCache.set(g.name,image);
if(image)g.image=image;
return image;
}catch(e){
imageCache.set(g.name,"");
return "";
}
}

img.style.display="none";
const found=await findGameImage(g);
if(found&&found!==src)img.src=found;
else emoji.style.display="inline";
};
img.src=src;
}else{
findGameImage(g).then(found=>{
if(found){
img.onload=()=>{img.style.display="block";emoji.style.display="none"};
img.onerror=()=>{img.style.display="none";emoji.style.display="inline"};
img.src=found;
}else emoji.style.display="inline";
});
}
}

function showGames(){
const q=document.getElementById("search").value.toLowerCase();
const p=document.getElementById("platform").value;
const genre=document.getElementById("genre").value;
const box=document.getElementById("games");
box.innerHTML="";

const filtered=gamesData.filter(g=>
g.name.toLowerCase().includes(q)&&
(p==="Hepsi"||g.platform===p)&&
(genre==="Hepsi"||g.genre===genre)
);

if(!filtered.length){
box.innerHTML='<div class="empty">Oyun bulunamadı 😕</div>';
return;
}

filtered.forEach(g=>{
const card=document.createElement("div");
card.className="card";

const cover=document.createElement("div");
cover.className="cover";
const emoji=document.createElement("span");
emoji.textContent=g.emoji;
cover.appendChild(emoji);

const img=document.createElement("img");
img.alt=g.name+" kapak resmi";
img.style.display="none";
cover.appendChild(img);
loadImage(img,emoji,g);

const info=document.createElement("div");
info.className="info";
const h=document.createElement("h3");
h.textContent=g.name;
const tag=document.createElement("span");
tag.className="tag";
tag.textContent=g.genre;
const platform=document.createElement("span");
platform.className="platform";
platform.textContent=g.platform;
const desc=document.createElement("p");
desc.textContent=g.desc;

const rating=document.createElement("div");
rating.className="cardRating";
const r=getRating(g.name);
rating.textContent=r.count?"⭐ "+r.average.toFixed(1)+" / 5 ("+r.count+" puan)":"⭐ Henüz puan yok";

info.append(h,tag,platform,desc,rating);
card.append(cover,info);
card.onclick=()=>openModal(g);
box.appendChild(card);
});
}

function openModal(g){
window.selectedGame=g.name;
document.getElementById("modal").classList.add("open");
document.getElementById("detailName").textContent=g.name;
document.getElementById("detailDescription").textContent=g.desc;
document.getElementById("detailHow").textContent=g.desc;
document.getElementById("download").href=g.url;
document.getElementById("detailEmoji").textContent=g.emoji;

const img=document.getElementById("detailImage");
const emoji=document.getElementById("detailEmoji");
img.style.display="none";
emoji.style.display="block";
img.onload=()=>{img.style.display="block";emoji.style.display="none"};
img.onerror=()=>{img.style.display="none";emoji.style.display="block"};

const src=imageUrl(g);
if(src)img.src=src;
else findGameImage(g).then(found=>{if(found)img.src=found});

const items=[
["🏢 Yapımcı",g.developer],
["📅 Çıkış tarihi",g.release],
["💰 Fiyat",g.price],
["🌐 Oynanış",g.mode],
["👥 Oyuncu sayısı",g.players],
["💾 Oyun boyutu",g.size],
["💻 Platform",g.system],
["🎮 Oyun türü",g.genre]
];

const details=document.getElementById("details");
details.innerHTML="";
items.forEach(item=>{
const div=document.createElement("div");
div.className="detailItem";
const small=document.createElement("small");
small.textContent=item[0];
const strong=document.createElement("strong");
strong.textContent=item[1];
div.append(small,strong);
details.appendChild(div);
});

showRating();
showComments();
}

function closeModal(){
document.getElementById("modal").classList.remove("open");
}

function showRating(){
const box=document.getElementById("starButtons");
box.innerHTML="";
const ratings=JSON.parse(localStorage.getItem("oyunPuanlari")||"{}");
const myRating=ratings[window.selectedGame+"_my"]||0;
for(let i=1;i<=5;i++){
const btn=document.createElement("button");
btn.className="star"+(i<=myRating?" active":"");
btn.textContent="★";
btn.onclick=()=>rateGame(i);
box.appendChild(btn);
}
const r=getRating(window.selectedGame);
document.getElementById("ratingText").textContent=
r.count?"Ortalama: "+r.average.toFixed(1)+" / 5 • "+r.count+" puan":"Bu oyuna henüz puan verilmemiş.";
}

function rateGame(value){
const ratings=JSON.parse(localStorage.getItem("oyunPuanlari")||"{}");
const name=window.selectedGame;
const old=ratings[name+"_my"]||0;
if(!ratings[name])ratings[name]=[];
if(old){
const index=ratings[name].indexOf(old);
if(index!==-1)ratings[name].splice(index,1);
}
ratings[name].push(value);
ratings[name+"_my"]=value;
localStorage.setItem("oyunPuanlari",JSON.stringify(ratings));
showRating();
showGames();
}

function showComments(){
const box=document.getElementById("comments");
box.innerHTML="";
const data=JSON.parse(localStorage.getItem("oyunYorumlari")||"{}");
const list=data[window.selectedGame]||[];
if(!list.length){
box.innerHTML='<p style="color:#8994b5">Henüz yorum yok. İlk yorumu sen yaz!</p>';
}
list.forEach(c=>{
const d=document.createElement("div");
d.className="comment";
d.textContent="💬 "+c;
box.appendChild(d);
});
}

function addComment(){
const input=document.getElementById("commentInput");
const value=input.value.trim();
if(!value)return;
const data=JSON.parse(localStorage.getItem("oyunYorumlari")||"{}");
if(!data[window.selectedGame])data[window.selectedGame]=[];
data[window.selectedGame].push(value);
localStorage.setItem("oyunYorumlari",JSON.stringify(data));
input.value="";
showComments();
}

document.getElementById("search").addEventListener("input",showGames);
document.getElementById("platform").addEventListener("change",showGames);
document.getElementById("genre").addEventListener("change",showGames);
document.getElementById("modal").addEventListener("click",e=>{
if(e.target.id==="modal")closeModal();
});
document.addEventListener("keydown",e=>{
if(e.key==="Escape")closeModal();
});

showGames();
</script>
</body>
</html>
